<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reach Out</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="contact-page">
        <section class="card">
            <a class="btn" href="index.html">Back Home</a>
            <h1>Contact Me</h1>
            <p>If you have any questions or would like to get in touch, feel free to reach out.</p>

            <div class="link-row">
                <span>LinkedIn: <a href="https://www.linkedin.com/in/eunice-muturi-7023b6342">Eunice Muturi</a></span>
                <span>GitHub: <a href="https://github.com/Eunice-ctrlz">Eunice-ctrlz</a></span>
            </div>

            <form action="https://formspree.io/f/movwprgj" method="POST" class="contact">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Type your message here..." required></textarea>

                <button type="submit" class="btn">Send</button>
            </form>
        </section>
    </main>
</body>
</html>
